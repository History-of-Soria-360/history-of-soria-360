<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Map with Info Panel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.css"
    />
    <script src="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>

    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      #threejs-container {
        width: 100%;
        height: 100%;
      }
      .marker {
        display: block;
        border: none;
        border-radius: 0;
        overflow: visible;
        cursor: pointer;
        padding: 0;
        background-size: contain;
        background-color: transparent;
        background-repeat: no-repeat;
        background-position: center;
        box-sizing: border-box;
      }


      #overlay {
        display: none;
        grid-template-columns: 70% 30%;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 85%;
        height: 70%;
        background: white;
        border-radius: 1rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        z-index: 1000;
        overflow: hidden;
        font-family: "Inter", sans-serif;
      }

      #overlay-left {
        width: 100%;
        height: 100%;
        background-color: #f9fafb;
        padding: 1rem;
        box-sizing: border-box;
        overflow: hidden;
      }

      #overlay-right {
        width: 100%;
        height: 100%;
        padding: 1rem;
        background-color: #ffffff;
        overflow-y: auto;
        border-left: 1px solid #e5e7eb;
        box-sizing: border-box;
      }

      #overlay-right h3 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }

      #image-description {
        font-size: 0.95rem;
        color: #374151;
        line-height: 1.5;
      }

      iframe {
        width: 100%;
        height: 80%;
        max-height: 100%;
        border: none;
        border-radius: 0.5rem;
        object-fit: cover;
      }

      #overlay-content {
        height: 100%;
      }

      #overlay-content iframe {
        height: 100%;
        width: 100%;
        border: none;
        border-radius: 0.5rem;
      }

      #threejs-container-wrapper {
        min-height: 400px;
        background-color: #eee; /* optional for debugging */
        width: 100%;
        height: 300px;
        position: relative;
      }


      .nav-button {
        position: absolute;
        background-color: #111827;
        color: white;
        border: none;
        padding: 0.5rem 0.75rem;
        cursor: pointer;
        font-size: 1.25rem;
        border-radius: 0.375rem;
        z-index: 1010;
        transition: background 0.2s;
      }

      .nav-button:hover {
        background-color: #1f2937;
      }

      #closeBtn {
        top: 10px;
        right: 10px;
      }

      #prevBtn,
      #nextBtn {
        top: 50%;
        transform: translateY(-50%);
      }

      #prevBtn {
        left: 10px;
      }

      #nextBtn {
        right: 10px;
      }


      /* Overlay styles for the camp view */

      #camp-overlay {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 85%;
        height: 70%;
        background: white;
        border-radius: 1rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        z-index: 1000;
        overflow: hidden;
        font-family: "Inter", sans-serif;
      }

      #camp-overlay.show {
        display: flex;
        pointer-events: auto;
      }

      #camp-overlay-content {
        display: flex;
        height: 100%;
      }

      #camp-overlay-left {
        width: 60%;
        padding: 1rem;
        background-color: #f9fafb;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      img.camp-image {
        width: 100%;
        max-height: 90%;
        object-fit: contain;
        display: block;
        margin: 0 auto;
      }



      #camp-media-container {
        width: 100%;
        height: 90%;
        display: flex;
        flex-direction: column; /* ← Add this */
        justify-content: center;
        align-items: center;
        overflow: hidden;
        flex-grow: 1;
        margin-bottom: 1rem;
      }

      #camp-iframe {
        width: 90%;
        height: 90%;
        max-height: 100%;
        object-fit: cover;
        border-radius: 0.5rem;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      }


      #camp-overlay-right {
        width: 40%;
        padding: 1rem;
        background-color: #ffffff;
        border-left: 1px solid #e5e7eb;
        box-sizing: border-box;
        overflow-y: auto;
      }

      #camp-overlay-right h3 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }

      #camp-description {
        font-size: 0.95rem;
        color: #374151;
        line-height: 1.5;
        margin-right: 15%;
      }

      #camp-iframe {
        width: 100%;
        height: 300px;
        border: none;
        border-radius: 0.5rem;
        object-fit: cover;
      }

      #camp-closeBtn {
        top: 10px;
        right: 10px;
        position: absolute;
        margin-top: 1rem;
        background-color: #e5e7eb;
        color: #374151;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        cursor: pointer;
        transition: background 0.2s;
      }

      #camp-closeBtn:hover {
        background-color: #d1d5db;
      }

      /* Overlay styles for the convent view */

      #convent-overlay {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 85%;
        height: 70%;
        background: white;
        border-radius: 1rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        z-index: 1000;
        overflow: hidden;
        font-family: "Inter", sans-serif;
      }

      #convent-overlay.show {
        display: flex;
        pointer-events: auto;
      }

      #convent-overlay-content {
        display: flex;
        height: 100%;
      }

      #convent-overlay-left {
        width: 50%;
        padding: 1rem;
        background-color: #f9fafb;
        box-sizing: border-box;
      }

      #convent-overlay-right {
        width: 40%;
        padding: 1rem;
        background-color: #ffffff;
        border-left: 1px solid #e5e7eb;
        box-sizing: border-box;
      }

      #convent-overlay-right h3 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }

      #convent-description {
        font-size: 0.95rem;
        color: #374151;
        line-height: 1.5;
        margin-right: 10%;

      }

      #convent-headline {
        font-size: 36px;    /* Adjust the font size */
        color: #1a202c;     /* Set the text color */
        font-weight: bold;  /* Make the text bold */
        margin-top: 20px;   /* Add some space above the headline */
        text-align: center; /* Center-align the text */
        line-height: 1.5;   /* Adjust line height for better readability */
      }


      #convent-subtitle {
        font-size: 18px; /* Adjust the font size */
        color: #333333;  /* Set the text color */
        font-style: italic;  /* Make the text italic */
        margin-top: 5px;  /* Add some space above the subtitle */
        margin-bottom: 10px; /* Add some space below the subtitle */
        text-align: center; /* Center the text */
        font-weight: normal; /* Adjust the font weight (normal, bold, etc.) */
        line-height: 1;  /* Adjust line height for better readability */
      }


      #convent-iframe {
        width: 100%;
        height: 80%;
        max-height: 100%;
        border: none;
        border-radius: 0.5rem;
        object-fit: cover;
      }

      #convent-overlay-left {
        width: 60%;
        padding: 1rem;
        background-color: #f9fafb;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center; /* Vertically center image+caption */
        align-items: center;
      }


      #convent-image {
        width: 100%;
        max-width: 600px;
        height: auto;
        object-fit: contain;
        border-radius: 0.5rem;
        margin-bottom: 0.5rem;
      }



      #convent-media-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;  /* Center contents vertically */
        flex: 1;                  /* Let it expand inside parent */
        padding: 1rem;
        width: 100%;
        box-sizing: border-box;
      }


      #convent-image,
      #convent-media-container img {
        width: 100%;
        height: auto;
        max-width: 600px;      /* Optional: keep it from being too wide */
        object-fit: contain;   /* or cover if you want it cropped */
        border-radius: 0.5rem;
      }


      .image-caption {
        margin-top: 0.5rem;
        font-size: 0.9em;
        color: #555;
        text-align: center;
        font-style: italic;
      }



      #convent-closeBtn {
        top: 10px;
        right: 10px;
        position: absolute;
        margin-top: 1rem;
        background-color: #e5e7eb;
        color: #374151;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        cursor: pointer;
        transition: background 0.2s;
      }

      #convent-closeBtn:hover {
        background-color: #d1d5db;
      }

      .annotation {
        position: absolute;
        background: white;
        padding: 5px;
        border: 1px solid black;
        cursor: pointer;
        font-size: 0.85rem;
        border-radius: 5px;
        z-index: 1001;
      }

      /* Container bar */
      .slider-background-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 20%;
        background-color: rgba(255, 255, 255, 0.85);
        padding: 20px 0;
        box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
        z-index: 1000;
      }

      /* Main slider wrapper */
      .timeline-slider {
        position: relative;
        width: 70%;
        padding: 0 8px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Range slider */
      .timeline-slider input[type="range"] {
        position: absolute;
        margin: 0 12px;
        padding: 0;
        top: 40px;
        width: 100%;
        z-index: 1;
        height: 6px;
        background: linear-gradient(to right, #797777 0%, #797777 100%);
        border-radius: 3px;
        appearance: none;
        outline: none;
        cursor: pointer;
      }

      /* Hover effect */
      .timeline-slider input[type="range"]:hover {
        background: #b2abab;
      }

      /* WebKit thumb */
      .timeline-slider input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        margin-left: 0;
        margin-right: 0;
        background: #333;
        cursor: pointer;
        position: relative;
        z-index: 3;
        transition: background 0.3s ease;
      }
      .timeline-slider input[type="range"]::-webkit-slider-thumb:hover {
        background: #555;
      }

      /* Firefox thumb */
      .timeline-slider input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #333;
        cursor: pointer;
        position: relative;
        z-index: 3;
        transition: background 0.3s ease;
      }
      .timeline-slider input[type="range"]::-moz-range-thumb:hover {
        background: #555;
      }

      /* Tick container */
      .timeline-ticks {
        display: flex;
        justify-content: space-between;
        width: 100%;
        position: relative;
        z-index: 2;
        pointer-events: none;
      }
      .tick-container {
        flex: 0.1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        pointer-events: none;
      }

      .tick-container:first-of-type {
        align-items: flex-start;
      }
      .tick-container:last-of-type {
        align-items: flex-end;
      }

      /* Tick line that crosses the slider */
      .tick-line {
        width: 2px;
        height: 40px;
        background-color: black;
        margin: 5px 0;
      }

      /* Labels */
      .tick-label {
        font-size: 14px;
      }
      .tick-label.top {
        margin-bottom: 0px;
        font-weight: italic;
      }
      .tick-label.bottom {
        margin-top: 0px;
        font-weight: bold;
      }
    </style>
  </head>

  <body class="relative">
    <div id="map"></div>

    <div class="slider-background-bar">
      <div class="timeline-slider">
        <div class="timeline-ticks">
          <div class="tick-container">
            <div class="tick-label top">1835</div>
            <div class="tick-line"></div>
            <div class="tick-label bottom">Convent</div>
          </div>
          <div class="tick-container">
            <div class="tick-label top">1936</div>
            <div class="tick-line"></div>
            <div class="tick-label bottom">Concentration Camp</div>
          </div>
          <div class="tick-container">
            <div class="tick-label top">Present day</div>
            <div class="tick-line"></div>
            <div class="tick-label bottom">Civic Park</div>
          </div>
        </div>

        <input
          type="range"
          min="0"
          max="2"
          step="0.01"
          value="2"
          id="timelineRange"
          class="range-slider"
        />
      </div>
    </div>

    <!-- Adding the overlay for the present day -->
    <div id="overlay">
      <button class="nav-button" id="closeBtn">✖</button>
      <button class="nav-button" id="prevBtn">←</button>
      <button class="nav-button" id="nextBtn">→</button>
    
      <div id="overlay-left">
        <div id="overlay-content"></div>
        <!-- DO NOT add #threejs-container-wrapper here if you're creating it dynamically in JS -->
      </div>
    
      <div id="overlay-right">
        <h3>360° view of the chosen site</h3>
        <p class="whitespace-pre-wrap" id="image-description"></p>
      </div>
    </div>
    

    <!--Adding the camp layer-->
    <div id="camp-overlay" class="overlay">
      <button class="nav-button" id="prevBtn">←</button>
      <button class="nav-button" id="nextBtn">→</button>
    
      <div id="camp-overlay-left">
        <div id="camp-media-container">
          <iframe
            id="camp-iframe"
            title="Camp Viewer"
            style="width: 100%; height: 300px; border: none; display: none"
          ></iframe>
    
          <img
            id="camp-image"
            src=""
            alt="Camp Image"

          />
          <p id="camp-caption" class="image-caption"></p>
        </div>
      </div>
    
      <div id="camp-overlay-right">
        <h3 id="camp-overlay-headline">Santa Clara Convent History</h3>
        <p id="camp-description">This is the concentration camp from 1936...</p>
      </div>
    
      <button class="nav-button" id="camp-closeBtn">✖</button>
    </div>
    
    <!--Adding the convent layer-->
    <div id="convent-overlay" class="overlay">
      <div id="convent-overlay-left">
        <!-- <h2 id="convent-overlay-headline">Convent View</h2> -->
        <div id="convent-media-container">
          <img
            id="convent-image"
            alt="Convent Image"
            src="./images/Stclara_1910.png"
          />
          <p id="convent-caption" class="image-caption"></p>
        </div>
      </div>

      <div id="convent-overlay-right">
        <h3 id="convent-headline">Santa Clara Convent History</h3>
        <p id="convent-subtitle"></p>
        <p id="convent-description"></p>

      </div>

      <button class="nav-button" id="convent-closeBtn">✖</button>
    </div>

    <!--- Add the custom JavaScript here -->
    <script type="module">
      // Create containers for the markers
      const presentDayMarkers = [];
      const conventMarkers = [];
      const campMarkers = [];

      /* Bulding markers */
      import { geojson } from "./soria-geo.js";
      import { loadCustomLayer } from "./3D-model-layer.js";
      import { conventGeojson } from "./soria-convent.js";
      import { campGeojson } from "./soria-camp.js";
      import { initThreejs } from "./3D-model-viewer.js";


      // Load the GeoJSON data for the convent
      const marker = conventGeojson.features[0];
      const imageElement = document.getElementById("convent-image");
      imageElement.src = marker.properties.link;

      // Initialize the map
      const map = new maplibregl.Map({
        container: "map",
        style:
          "https://api.maptiler.com/maps/satellite/style.json?key=TdTwD7oIRpXkUvhlz3qX",
        center: [-2.4661792987112507, 41.76136750285904],
        zoom: 18,
        pitch: 0,
      });

      // Add navigation controls
      let currentIndex = null;

      // Add navigation controls to the map
      function showOverlay(index) {
        const feature = geojson.features[index];
        const modelKey = feature.properties.model;
        const description = feature.properties.description;

        console.log("Model:", modelKey);
        console.log("Description:", description);

        // Show overlay
        document.getElementById("overlay").style.display = "grid";

        // Set the LEFT panel content
        document.getElementById("overlay-content").innerHTML =
          `<div id="threejs-container-wrapper" style="position: relative; width: 100%; height: 100%;">
            <div id="threejs-container" style="width: 100%; height: 100%;"></div>
          </div>`;

        // ✅ Now the element exists – safe to call init
        initThreejs("threejs-container", modelKey);

        // ✅ Set description in the RIGHT panel
        const descBox = document.getElementById("image-description");
          if (descBox) {
            descBox.innerHTML = description;
          } else {
            console.warn("No #image-description element found.");
          }


        currentIndex = index;
      }



      // This event listener is for the close button
      document.getElementById("closeBtn").addEventListener("click", () => {
        document.getElementById("overlay").style.display = "none";
        document.getElementById("overlay-content").innerHTML = "";
        document.getElementById("image-description").textContent = "";
        currentIndex = null;
      });

      document.getElementById("prevBtn").addEventListener("click", () => {
        if (currentIndex === null) return;
        const prevIndex = geojson.features[currentIndex]?.properties?.prev;
        if (prevIndex != null && geojson.features[prevIndex]) {
          showOverlay(prevIndex);
        }
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        if (currentIndex === null) return;
        const nextIndex = geojson.features[currentIndex]?.properties?.next;
        if (nextIndex != null && geojson.features[nextIndex]) {
          showOverlay(nextIndex);
        }
      });

      function setMarkersVisibility(markers, visible) {
        markers.forEach((marker) => {
          const el = marker.getElement();
          el.style.display = visible ? "block" : "none";
        });
      }

      // Add the convent map to the page
      map.on("load", () => {
        map.addSource("conventPlanImage", {
          type: "image",
          url: "./images/Convent_image.png",
          coordinates: [
            [-2.468178, 41.762657], // top-left
            [-2.4641416118235915, 41.76240767386252], // top-right
            [-2.4643543374292496, 41.760334321527054], // bottom-right
            [-2.468326, 41.760577], // bottom-left
          ],
        });

        // Add the camp map to the page
        map.addSource("camp-map", {
          type: "image",
          url: "./images/santaclara_camp.png",
          coordinates: [
            [-2.467844, 41.762366], // top-left
            [-2.4639595395427603, 41.762158436832834], // top-right
            [-2.464092, 41.760682], // bottom-right
            [-2.467963, 41.760846], // bottom-left
          ],
        });

        // Find the first symbol layer to place the raster below it
        const layers = map.getStyle().layers;
        const firstSymbolId = layers.find((l) => l.type === "symbol")?.id;

        map.addLayer(
          {
            id: "image-layer",
            type: "raster",
            source: "conventPlanImage",
            paint: {
              "raster-fade-duration": 0,
              "raster-opacity": 0, // starts hidden, controlled via slider
            },
          },
          firstSymbolId
        ); // places the raster below markers/labels

        // Add the 3D model layer
        loadCustomLayer((customLayer) => {
          map.addLayer(customLayer);
        });

        // Add the camp layer
        map.addLayer(
          {
            id: "camp-map-layer",
            type: "raster",
            source: "camp-map",
            paint: {
              "raster-fade-duration": 0,
              "raster-opacity": 0, // start hidden, reveal using slider
            },
          },
          firstSymbolId
        );

   // Add markers to the map
      geojson.features.forEach((marker, index) => {
        const el = document.createElement("div");
        el.className = "marker";
        const iconURL = marker.properties.icon || 'https://cdn-icons-png.flaticon.com/128/7976/7976202.png';
        el.style.backgroundImage = `url('${iconURL}')`;
        el.style.backgroundSize = "contain";
        el.style.backgroundRepeat = "no-repeat";
        el.style.backgroundPosition = "center";
        el.style.width = `${marker.properties.iconSize[0]}px`;
        el.style.height = `${marker.properties.iconSize[1]}px`;

        // ✅ Click event
        el.addEventListener("click", () => {
          showOverlay(index);
          const modelKey = marker.properties.model;
        });

        // ✅ Add marker to map (outside the click event)
        const mapMarker = new maplibregl.Marker({ element: el })
          .setLngLat(marker.geometry.coordinates)
          .addTo(map);

        presentDayMarkers.push(mapMarker);
      });

      setMarkersVisibility(presentDayMarkers, false);


        // Add camp markers
        campGeojson.features.forEach((marker) => {
          const el = document.createElement("div");
          el.className = "marker";
          const iconURL = marker.properties.icon || 'https://cdn-icons-png.flaticon.com/128/7976/7976202.png';
          el.style.backgroundImage = `url('${iconURL}')`;
          el.style.backgroundSize = "contain";
          el.style.backgroundRepeat = "no-repeat";
          el.style.backgroundPosition = "center";
          el.style.width = `${marker.properties.iconSize[0]}px`;
          el.style.height = `${marker.properties.iconSize[1]}px`;

          el.addEventListener("click", () => {
            const overlay = document.getElementById("camp-overlay");
            overlay.classList.add("show");

            const modelKey = marker.properties.model;
            const link = marker.properties.link;
            const caption = marker.properties.caption;
            const name = marker.properties.name;
            const description = marker.properties.description;

            const mediaContainer = document.getElementById("camp-media-container");
            mediaContainer.innerHTML = "";

            if (modelKey && modelKey.endsWith(".glb")) {
              mediaContainer.innerHTML = `
                <div id="threejs-container-wrapper" style="position: relative; width: 100%; height: 300px;">
                  <div id="threejs-container" style="width: 100%; height: 100%;"></div>
                </div>
              `;
              setTimeout(() => {
                initThreejs("threejs-container", modelKey);
              }, 0);

            } else if (link) {
              if (link.endsWith(".mp4")) {
                const video = document.createElement("video");
                video.src = link;
                video.controls = true;
                video.style = "width: 100%; height: 300px; object-fit: cover;";
                mediaContainer.appendChild(video);
              } else {
                const img = document.createElement("img");
                img.src = link;
                img.alt = "Camp Image";
                img.classList.add("camp-image");
                mediaContainer.appendChild(img);


              }
            }

            if (caption) {
              const captionElement = document.createElement("p");
              captionElement.className = "image-caption";
              captionElement.textContent = caption;
              mediaContainer.appendChild(captionElement);
            }

            document.getElementById("camp-overlay-headline").textContent = name || "Camp Marker";
            document.getElementById("camp-description").innerHTML = description || "";


            // Optional: Zoom for special markers
            if (marker.properties.name === "Forced Labour") {
              map.flyTo({
                center: marker.geometry.coordinates,
                zoom: 16,
                speed: 1.2,
                curve: 1,
                essential: true,
              });
            }
          });

          const mapMarker = new maplibregl.Marker({ element: el })
            .setLngLat(marker.geometry.coordinates)
            .addTo(map);

          campMarkers.push(mapMarker);
        });

        setMarkersVisibility(campMarkers, false);

        // Close button for the camp overlay
        document.getElementById("camp-closeBtn").addEventListener("click", () => {
            const overlay = document.getElementById("camp-overlay");
            overlay.classList.remove("show");

            //document.getElementById("camp-iframe").src = "";
            document.getElementById("camp-overlay-headline").textContent = "";
            document.getElementById("camp-description").textContent = "";
          });

        // Add convent markers with a separate overlay design
        conventGeojson.features.forEach((marker) => {
          const el = document.createElement("div");
          el.className = "marker";
          const iconURL = marker.properties.icon || 'https://cdn-icons-png.flaticon.com/128/7976/7976202.png';
          el.style.backgroundImage = `url('${iconURL}')`;
          el.style.backgroundSize = "contain";
          el.style.backgroundRepeat = "no-repeat";
          el.style.backgroundPosition = "center";
          el.style.width = `${marker.properties.iconSize[0]}px`;
          el.style.height = `${marker.properties.iconSize[1]}px`;

          el.addEventListener("click", () => {
          const overlay = document.getElementById("convent-overlay");
          overlay.classList.add("show");

          const mediaContainer = document.getElementById("convent-media-container");

          // Clear previous content (image or video)
          mediaContainer.innerHTML = "";

          if (marker.properties.link.endsWith(".mp4")) {
            const videoElement = document.createElement("video");
            videoElement.src = marker.properties.link;
            videoElement.controls = true;
            mediaContainer.appendChild(videoElement);
          } else {
            const imageElement = document.createElement("img");
            imageElement.src = marker.properties.link;
            imageElement.alt = "Convent Image";
            mediaContainer.appendChild(imageElement);
          }

          // Add caption
          if (marker.properties.caption) {
            const captionElement = document.createElement("p");
            captionElement.className = "image-caption";
            captionElement.textContent = marker.properties.caption;
            mediaContainer.appendChild(captionElement);
          }



          // Update text content
          document.getElementById("convent-description").innerHTML = marker.properties.description;
          document.getElementById("convent-headline").innerText = marker.properties.name;


          const subtitleElement = document.getElementById("convent-subtitle");
            if (marker.properties.subtitle) {
              subtitleElement.innerText = marker.properties.subtitle;
            } else {
              subtitleElement.innerText = ""; // Fallback message
            }

              const captionElement = document.getElementById("convent-caption");
              captionElement.textContent = marker.properties.caption || "";
        
        });


          const mapMarker = new maplibregl.Marker({ element: el })
            .setLngLat(marker.geometry.coordinates)
            .addTo(map);

          conventMarkers.push(mapMarker);
        });

        setMarkersVisibility(conventMarkers, false);

        // Close button for the convent overlay
        document
          .getElementById("convent-closeBtn")
          .addEventListener("click", () => {
            const overlay = document.getElementById("convent-overlay");
            overlay.classList.remove("show");

            // document.getElementById("convent-iframe").src = "";
            // document.getElementById("convent-overlay-headline").textContent = "";
            // document.getElementById("convent-description").textContent = "";
          });

        // Timeline slider functionality
        const timelineRange = document.getElementById("timelineRange");
        const timelineSteps = document.querySelectorAll(
          ".timeline-steps .step"
        );

        timelineRange.addEventListener("input", (e) => {
          const value = e.target.value;
          updateTimeline(value);
        });

        // Initialize the timeline
        function updateTimeline(value) {
          const valueNum = parseFloat(value);

          // Set opacity of the historic overlay
          let imageOpacity = 0;
          let modelOpacity = 0;

          if (valueNum <= 1) {
            // From convent (0) to concentration camp (1)
            imageOpacity = 1 - valueNum; // 1 → 0
            modelOpacity = valueNum; // 0 → 1
          } else {
            // From concentration camp (1) to today (2)
            imageOpacity = 0;
            modelOpacity = 2 - valueNum; // 1 → 0
          }

          // Update map layer opacity
          map.setPaintProperty("image-layer", "raster-opacity", imageOpacity);
          map.setPaintProperty(
            "camp-map-layer",
            "raster-opacity",
            modelOpacity
          );

          // Control marker visibility cleanly
          if (valueNum < 0.5) {
            // Show convent markers only
            setMarkersVisibility(conventMarkers, true);
            setMarkersVisibility(campMarkers, false);
            setMarkersVisibility(presentDayMarkers, false);
          } else if (valueNum < 1.5) {
            // Show camp markers only
            setMarkersVisibility(conventMarkers, false);
            setMarkersVisibility(campMarkers, true);
            setMarkersVisibility(presentDayMarkers, false);
          } else {
            // Show present-day markers only
            setMarkersVisibility(conventMarkers, false);
            setMarkersVisibility(campMarkers, false);
            setMarkersVisibility(presentDayMarkers, true);
          }
        }

        updateTimeline(timelineRange.value);
      });
    </script>
  </body>
</html>
